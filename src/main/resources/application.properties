spring.application.name=database-normalization

# 1. database connection url (points to Docker container and database)
spring.datasource.url=jdbc:mysql://localhost:3306/data_normalization?allowPublicKeyRetrieval=true&useSSL=false

# 2. database authentication credentials
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# 3. hibernate configuration (tells spring to use mysql syntax dialect) 
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 4. safety first: do not let hibernate overwrite the database tables we just built
spring.jpa.hibernate.ddl-auto=validate

# 5. print raw sql queries in console
spring.jpa.show-sql=true

# 6. point flyway to an existing local database
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

#7. JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000